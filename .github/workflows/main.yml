name: Build Glass AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        shell: bash
        run: |
          set -e

          if [ ! -f lib/main.dart ]; then
            if [ ! -f main.dart ]; then
              echo "::error::main.dart or lib/main.dart is missing"
              exit 1
            fi
            mkdir -p lib
            cp main.dart lib/main.dart
          fi

          if [ ! -f pubspec.yaml ]; then
            flutter create --project-name glass_ai --platforms=android .
          else
            flutter create --project-name glass_ai --platforms=android .
          fi

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml

      - name: Configure Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              marker = 'xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker not in text:
                  raise SystemExit("Android manifest marker not found")
              text = text.replace(marker, marker + "\n    " + permission, 1)
              path.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
