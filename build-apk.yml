name: Build Glass AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --project-name glass_ai --platforms=android .

      - name: Ensure Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in s:
              marker = 'xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker not in s:
                  raise SystemExit("Could not locate Android manifest namespace marker")
              s = s.replace(marker, marker + "\\n    " + permission, 1)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
